<section id="projects" class="section projects">
  <p class="section-label">Projects</p>
  <h2 class="section-title">Things I've built</h2>

  <div class="projects__grid">
    @for (project of projects; track project.url) {
      <a class="projects__card" [href]="project.url" target="_blank" rel="noopener">
        <div class="projects__card-head">
          <h3>{{ project.name }}</h3>
          <span class="projects__lang">{{ project.language }}</span>
        </div>
        <p>{{ project.description }}</p>
        <span class="projects__link">View on GitHub →</span>
      </a>
    }
  </div>

  <a class="projects__more" href="https://github.com/nokvai?tab=repositories" target="_blank" rel="noopener">
    See all repositories on GitHub →
  </a>
</section>
